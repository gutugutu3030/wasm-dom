# wasm-dom ビルド環境設定。**このディレクトリがビルドルートのときだけ読まれる**
# （親から `include(":wasm-dom")` して打ったときは親の `gradle.properties` が効く）
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin daemon / Gradle daemon のヒープ（wasm のコンパイルは重い・親と同じ確保量）
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

kotlin.code.style=official

# GitHub Release の採番が書き換える行（`.github/workflows/release.yml` が sed で更新する）。
# Gradle は `gradle.properties` の `version` をそのまま `project.version` に読むので、
# build.gradle.kts 側の指定は要らない。
#
# **今は誰にも読まれない値**（親は `include(":wasm-dom")` / これからやる `includeBuild` での
# 依存差し替えは座標を見て版本を見ない）。ここにある意味は GitHub Release のタグと
# changelog の種を作ること。親が submodule の gitlink（コミット）で版を固定するのと衝突はしない。
# maven-publish で配給する日が来たら、この値が本当に効いてくる
version=0.1.0
