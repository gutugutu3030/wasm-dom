# wasm-dom ビルド環境設定。**このディレクトリがビルドルートのときだけ読まれる**
# （親から `include(":wasm-dom")` して打ったときは親の `gradle.properties` が効く）
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin daemon / Gradle daemon のヒープ（wasm のコンパイルは重い・親と同じ確保量）
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

kotlin.code.style=official

# **Maven Local に配るときの座標**（`./gradlew publishToMavenLocal`）。Gradle は `gradle.properties` の
# `group` / `version` をそのまま `project.group` / `project.version` に読むので、build.gradle.kts 側に
# 指定は要らない。artifactId は `rootProject.name` から来て、座標は `app.konpeto.konpetomoide:wasm-dom`
# （target ごとに `wasm-dom-jvm` と `wasm-dom-wasm-js` も並ぶ）
group=app.konpeto.konpetomoide

# GitHub Release の採番が書き換える行（`.github/workflows/release.yml` が sed で更新する）。
# Gradle は `gradle.properties` の `version` をそのまま `project.version` に読むので、
# build.gradle.kts 側の指定は要らない。
#
# **この値が配給の版本そのもの**（`app.konpeto.konpetomoide:wasm-dom:<ここ>` を読む側が引く）。
# 上げるなら `publishToMavenLocal` → 読む側の `build.gradle.kts` の座標 → `--write-locks`。
# 親が submodule の gitlink で版を固定していたころの名残で、**タグの v とこの値は同じ**に保つ
version=0.1.0
