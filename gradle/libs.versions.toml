# wasm-dom バージョンカタログ（**このリポジトリ専用の 1 本**）。読む側（アプリ）にも別のカタログが
# あるが、共有ではない。
#
# ただし `kotlin` は**読む側と同じ値が命**。ここでビルドした klib を向こうのコンパイラが読むので、
# 新しい Kotlin で作るとメタデータ版本で弾かれる。配給が Maven Local になったので**機械の突合は
# 無い**（以前は 2 つのビルドが同じ `gradle.lockfile` を STRICT で読み、片方だけ上げると
# ping-pong して落ちた）。上げる日は**両方を同じ日に**。
#
# interop の穴は版本が効く（同じコードでも Kotlin の版本で通る／通らないが変わる）ので、
# 実測は `docs/kb-wasm-bridge.md` に残す
#
# 読む側にあってここに無いもの（serialization / ktor）は土台が引かない依存。足さない

[versions]
kotlin = "2.4.21"
# wasm アプリの DOM / browser API 宣言。土台の公開 API が `HTMLElement` / `Blob` を返すので
# `api` で出す（`implementation` にすると読む側が型を見失う）
kotlinx-browser = "0.5.0"
spotless = "8.7.0"
# 整形エンジンのピン。spotless の既定解決に任せず、上げたときに整形結果が静かに変わるのを防ぐ
ktlint = "1.8.0"

[libraries]
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# --- ビルドツール（OSV 監査用）---
# spotless は ktlint を実行時に独自解決して `gradle.lockfile` を通さないため、`./gradlew audit`
# の網から外れる。同じ座標をここに置き、`buildTooling` 設定で解決してロックに載せる
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
